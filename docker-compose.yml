version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cakeup-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - cakeup-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cakeup-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - cakeup-network
    restart: unless-stopped

networks:
  cakeup-network:
    driver: bridge



